# Shopify Theme CLI Configuration
# Used by Shopify CLI 3.x for theme development commands.
# Reference: https://shopify.dev/docs/storefronts/themes/tools/cli

[theme]
name = "Digital Product Enhancer Demo Theme"
store = "rouse-commerce-lab.myshopify.com"

# Set theme_id to "live" to target the live theme, or use a numeric theme ID.
# Get theme IDs via: shopify theme list
theme_id = "live"

[development]
store = "rouse-commerce-lab.myshopify.com"

# Preview URL is auto-generated by `shopify theme dev`
# Uncomment and set a specific port if needed:
# port = 9292

# App Proxy Configuration
# Routes requests from https://rouse-commerce-lab.myshopify.com/apps/enhancer/...
# to your app backend URL, allowing Liquid templates to render the response.
# Reference: https://shopify.dev/docs/apps/build/online-store/app-proxies
[app_proxy]
url = "https://your-app-backend.example.com"
subpath = "enhancer"
prefix = "apps"
